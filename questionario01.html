<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso 60+ - clique na opção correta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #333;
        }

        #question {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }

        button:hover {
            background-color: #218838;
        }

        #options button {
            display: block;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 10px;
            margin: 10px auto;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        #options button:hover {
            background: #0056b3;
        }

        #result {
            font-size: 1.2em;
            margin-top: 20px;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quiz de Tecnologia 60+</h1>
        <div id="quiz-container">
            <div id="question">Carregando...</div>
            <div id="options"></div>
        </div>
        <button id="next-btn" onclick="nextQuestion()">Próxima</button>
        <div id="result"></div>
    </div>
    <script>
        const questions = [
            {
                question: "O que é o ChatGPT?",
                options: [
                    "Uma ferramenta de inteligência artificial para responder perguntas e ajudar em várias tarefas.",
                    "Um site de redes sociais.",
                    "Um aplicativo para assistir vídeos.",
                    "Um novo modelo de smartphone."
                ],
                answer: 0,
                explanation: "O ChatGPT é uma inteligência artificial desenvolvida para responder perguntas e auxiliar em diversas tarefas."
            },
            {
                question: "O que é um Firewall?",
                options: [
                    "Um sistema de segurança que protege contra acessos não autorizados.",
                    "Um tipo de navegador de internet.",
                    "Uma senha para acessar redes Wi-Fi.",
                    "Um programa para editar fotos."
                ],
                answer: 0,
                explanation: "Um firewall ajuda a proteger seu computador contra acessos não autorizados e ameaças da internet."
            },
            {
                question: "O que significa VPN?",
                options: [
                    "Uma rede privada virtual que aumenta a segurança online.",
                    "Um novo modelo de processador para computadores.",
                    "Um tipo de conexão Bluetooth.",
                    "Um aplicativo para enviar mensagens."
                ],
                answer: 0,
                explanation: "VPN significa Rede Privada Virtual, que ajuda a criar uma conexão segura na internet."
            },
            {
                question: "O que é um QR Code?",
                options: [
                    "Um código de barras bidimensional que pode ser escaneado por smartphones.",
                    "Um novo tipo de processador para celulares.",
                    "Um formato de arquivo de vídeo.",
                    "Um programa de computador para editar imagens."
                ],
                answer: 0,
                explanation: "O QR Code é um código que pode ser escaneado para acessar informações rapidamente."
            },
            {
                question: "O que significa URL?",
                options: [
                    "O endereço de um site na internet.",
                    "Um tipo de cabo para conectar dispositivos.",
                    "Uma senha para desbloquear smartphones.",
                    "Um software de edição de vídeos."
                ],
                answer: 0,
                explanation: "A URL é o endereço que você digita no navegador para acessar um site."
            }
        ];

        let currentQuestionIndex = 0;

        function showQuestion() {
            const questionElement = document.getElementById("question");
            const optionsElement = document.getElementById("options");
            const currentQuestion = questions[currentQuestionIndex];

            questionElement.textContent = currentQuestion.question;
            optionsElement.innerHTML = "";

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.textContent = option;
                button.onclick = () => checkAnswer(index);
                optionsElement.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex) {
            const currentQuestion = questions[currentQuestionIndex];
            const resultElement = document.getElementById("result");

            if (selectedIndex === currentQuestion.answer) {
                resultElement.textContent = "Correto! " + currentQuestion.explanation;
            } else {
                resultElement.textContent = "Errado. " + currentQuestion.explanation;
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                document.getElementById("result").textContent = "";
                showQuestion();
            } else {
                document.getElementById("quiz-container").innerHTML = "<h2>Quiz concluído! Parabéns!</h2>";
            }
        }

        showQuestion();
    </script>
</body>
</html>
