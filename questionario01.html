<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso 60+ - clique na opção correta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #333;
        }

        #question {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }

        button:hover {
            background-color: #218838;
        }

        #options button {
            display: block;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 10px;
            margin: 10px auto;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        #options button:hover {
            background: #0056b3;
        }

        #result {
            font-size: 1.2em;
            margin-top: 20px;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quiz de Tecnologia 60+</h1>
        <div id="quiz-container">
            <div id="question">Carregando...</div>
            <div id="options"></div>
        </div>
        <button id="next-btn" onclick="nextQuestion()">Próxima</button>
        <div id="result"></div>
    </div>
    <script>
        const questions = [
            { question: "O que é um navegador de internet?", options: ["Um programa para acessar sites.", "Um tipo de computador.", "Um antivírus.", "Um aplicativo de mensagens."], answer: 0, explanation: "O navegador é o programa usado para acessar sites na internet, como Chrome, Firefox e Edge." },
            { question: "O que é um e-mail?", options: ["Uma mensagem eletrônica enviada pela internet.", "Um número de telefone.", "Um site de redes sociais.", "Um documento impresso."], answer: 0, explanation: "E-mail é uma forma de comunicação online usada para enviar e receber mensagens eletrônicas." },
            { question: "O que significa Wi-Fi?", options: ["Uma tecnologia que permite conexão sem fio à internet.", "Um tipo de cabo de rede.", "Uma marca de celular.", "Um sistema de segurança para computadores."], answer: 0, explanation: "Wi-Fi é uma tecnologia que permite conectar dispositivos à internet sem a necessidade de cabos." },
            { question: "O que é um aplicativo (app)?", options: ["Um programa que pode ser instalado em smartphones e computadores.", "Um site de notícias.", "Um tipo de conexão de internet.", "Um formato de vídeo."], answer: 0, explanation: "Aplicativos são programas desenvolvidos para realizar tarefas específicas, como WhatsApp e YouTube." },
            { question: "O que é um smartphone?", options: ["Um celular com acesso à internet e aplicativos.", "Um telefone fixo.", "Um computador de mesa.", "Um modelo de televisão."], answer: 0, explanation: "Um smartphone é um telefone inteligente que permite acessar a internet, instalar aplicativos e realizar diversas funções." },
            { question: "O que significa a sigla PDF?", options: ["Um formato de arquivo usado para documentos.", "Um site de compras online.", "Um aplicativo de redes sociais.", "Um antivírus."], answer: 0, explanation: "PDF é um formato de arquivo usado para armazenar documentos de forma segura e compatível com diversos dispositivos." },
            { question: "Para que serve o Google?", options: ["Para pesquisar informações na internet.", "Para criar documentos de texto.", "Para editar vídeos.", "Para conectar dispositivos Bluetooth."], answer: 0, explanation: "O Google é um mecanismo de busca que ajuda a encontrar informações na internet." },
            { question: "O que é um antivírus?", options: ["Um programa que protege o computador contra ameaças digitais.", "Um navegador de internet.", "Uma senha de segurança.", "Um tipo de conexão Wi-Fi."], answer: 0, explanation: "O antivírus é um software que protege dispositivos contra vírus e outras ameaças online." },
            { question: "O que significa copiar e colar no computador?", options: ["Duplicar um texto ou arquivo e colocá-lo em outro local.", "Salvar um documento na nuvem.", "Criar um atalho na área de trabalho.", "Desligar o computador."], answer: 0, explanation: "Copiar e colar permite duplicar textos ou arquivos para facilitar a edição e organização de informações." },
            { question: "O que é um backup?", options: ["Uma cópia de segurança de arquivos importantes.", "Um tipo de conexão de internet.", "Um aplicativo para tirar fotos.", "Uma nova rede social."], answer: 0, explanation: "Backup é uma cópia de segurança feita para evitar a perda de arquivos importantes em caso de falha do dispositivo." }
        ];

        let currentQuestionIndex = 0;

        function showQuestion() {
            const questionElement = document.getElementById("question");
            const optionsElement = document.getElementById("options");
            const currentQuestion = questions[currentQuestionIndex];

            questionElement.textContent = currentQuestion.question;
            optionsElement.innerHTML = "";

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.textContent = option;
                button.onclick = () => checkAnswer(index);
                optionsElement.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex) {
            const currentQuestion = questions[currentQuestionIndex];
            const resultElement = document.getElementById("result");

            resultElement.textContent = selectedIndex === currentQuestion.answer ? "Correto! " + currentQuestion.explanation : "Errado. " + currentQuestion.explanation;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                document.getElementById("result").textContent = "";
                showQuestion();
            } else {
                document.getElementById("quiz-container").innerHTML = "<h2>Quiz concluído! Parabéns!</h2>";
            }
        }

        showQuestion();
    </script>
</body>
</html>
